<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAYFLOW UI Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#111722; --sidebar:#1B2533; --card:#202D3D; --card2:#26354A;
  --pink:#F4B8CE; --pink2:#F8D5E2; --rose:#D98CAB;
  --text:#F5F6FA; --muted:#AAB4C3; --border:#354154;
  --pink-soft:rgba(244,184,206,.12); --ok:#9FD8B8; --slate:#8A97AB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;height:100vh;overflow:hidden}
[hidden]{display:none!important}
.window{display:flex;flex-direction:column;height:100vh}
.titlebar{height:34px;background:#0D121B;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 14px;border-bottom:1px solid #1a2230;flex-shrink:0}
.titlebar .brand{font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:600;display:flex;gap:8px;align-items:center}
.titlebar .brand svg{color:var(--pink)}
.winbtns{display:flex}.winbtns span{width:46px;height:34px;display:grid;place-items:center;color:var(--muted)}
.winbtns span:hover{background:#1f2836}.winbtns span:last-child:hover{background:#c42b1c;color:#fff}
.app{display:flex;flex:1;min-height:0}
.app.auth .sidebar{display:none}
.app.auth main{padding:0;display:flex}

/* ---------- sidebar ---------- */
.sidebar{width:236px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;transition:width .2s;flex-shrink:0}
.sidebar.collapsed{width:68px}
.sidebar.collapsed .label,.sidebar.collapsed .logo-text{display:none}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--rose));display:grid;place-items:center;color:#2a1a22;flex-shrink:0}
.logo-mark svg{width:18px;height:18px}
.logo-text b{font-size:15px;letter-spacing:.12em}.logo-text small{display:block;color:var(--muted);font-size:11px}
.datecard{display:flex;align-items:center;gap:12px;padding:2px 6px 18px}
.datecard .tile{width:46px;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--border);text-align:center;flex-shrink:0}
.datecard .tile span{display:block;background:var(--pink);color:#2a1a22;font-size:10px;font-weight:700;letter-spacing:.12em;padding:2px 0}
.datecard .tile b{display:block;font-size:20px;font-weight:700;padding:3px 0 4px}
.datecard .logo-text b{font-size:15px;letter-spacing:0;font-weight:600}
.datecard .logo-text small{font-size:12px;margin-top:1px}
.sidebar.collapsed .datecard{padding-left:0;padding-right:0;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a,.nav .grp{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;position:relative;background:none;border:0;font:inherit;width:100%;text-align:left}
.nav a:hover,.nav .grp:hover{background:#223044;color:var(--text)}
.nav a.active{background:var(--pink-soft);color:var(--pink)}
.nav a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pink)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav .grp .label{flex:1}
.nav .grp .grp-chev{width:15px;height:15px}
.nav .sub{display:flex;flex-direction:column;gap:2px;position:relative}
.nav .sub::before{content:"";position:absolute;left:19px;top:4px;bottom:4px;width:1px;background:var(--border)}
.nav .sub a{padding-left:34px}
.nav .sub a svg{width:16px;height:16px}
.sidebar.collapsed .nav .sub a{padding-left:10px}
.sidebar.collapsed .nav .sub::before{display:none}
.side-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.side-foot button{background:none;border:0;color:var(--muted);display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit}
.side-foot button:hover{background:#223044;color:var(--text)}
.side-foot svg{width:18px;height:18px;flex-shrink:0}
.ext-status{display:flex;gap:10px;align-items:center;padding:8px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7688;flex-shrink:0;margin:0 5px}

/* ---------- base ---------- */
main{flex:1;overflow:auto;padding:26px 30px 60px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
.sub{color:var(--muted);margin-top:4px}
.hero-head{flex:1;min-width:280px}
.hero-head .greet{color:var(--muted);font-size:15px;font-weight:500}
.hero-head .motto{font-size:clamp(34px,4.2vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin-top:6px;color:var(--pink2)}
.hero-head .motto q{quotes:"\201C" "\201D"}
.hero-head .motto q::before,.hero-head .motto q::after{color:var(--pink)}
.topbar.hero{align-items:center;margin-bottom:26px}
.seg{display:flex;background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:9px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--pink);color:#2a1a22;font-weight:600}
.seg.sm{border-radius:10px;padding:2px}.seg.sm button{padding:4px 10px;font-size:12px;border-radius:8px}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.card h3 .t{display:flex;gap:8px;align-items:center}
.card h3 .t svg{width:16px;height:16px;color:var(--pink)}
.muted{color:var(--muted)}
.btn{background:var(--pink);color:#2a1a22;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .1s,background .15s}
.btn:hover{background:var(--pink2)}.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--pink);color:var(--pink)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{width:100%}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--pink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.link svg{width:15px;height:15px}.link.muted{color:var(--muted)}.link:hover{text-decoration:underline}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--sidebar);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;flex-shrink:0}
.icon-btn:hover{color:var(--pink);border-color:var(--pink)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.sm{width:32px;height:32px}.icon-btn.sm svg{width:15px;height:15px}
.icon-btn:disabled{opacity:.35;cursor:default;border-color:var(--border);color:var(--muted)}
.icon-btn .badge{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--sidebar)}
.hdr-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#2b3a4f;color:var(--muted);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.tag svg{width:12px;height:12px}
.tag.high{background:rgba(217,140,171,.18);color:var(--pink)}
.tag.pink{background:var(--pink-soft);color:var(--pink)}
.tag.ok{background:rgba(159,216,184,.14);color:var(--ok)}
.bar{height:6px;background:#2b3a4f;border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--pink);border-radius:6px;transition:width .5s}

/* ---------- login ---------- */
.login-wrap{flex:1;display:grid;place-items:center;padding:90px 16px 40px;background:radial-gradient(640px 420px at 50% 28%,rgba(244,184,206,.10),transparent 70%)}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 28px 26px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.login-pets{position:absolute;top:-70px;left:0;right:0;display:flex;justify-content:center;gap:0;pointer-events:none}
.login-pets .mascot{width:84px;height:84px}
.login-card .logo{justify-content:center;padding:0 0 6px}
.login-card h1{text-align:center;font-size:22px;margin-top:10px}
.login-card .sub{text-align:center;margin-bottom:8px}
.lb{font-size:12px;color:var(--muted);display:block;margin:16px 0 6px}
.inp{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:0 12px;transition:border-color .15s}
.inp:focus-within{border-color:var(--pink)}
.inp input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:12px 0;outline:none}
.inp input::placeholder{color:#6f7b8e}
.inp svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.inp button{background:none;border:0;color:var(--muted);cursor:pointer;display:grid;padding:4px}
.inp button:hover{color:var(--pink)}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--pink);width:15px;height:15px}
.login-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

/* ---------- dropdown ---------- */
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sidebar);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-weight:500;cursor:pointer;min-width:200px;transition:border-color .15s}
.dd-btn .l{display:flex;gap:9px;align-items:center}
.dd-btn svg{width:16px;height:16px}
.dd-btn .l svg{color:var(--pink)}
.dd-btn:hover,.dd.open .dd-btn{border-color:var(--pink)}
.dd .chev{color:var(--muted);transition:transform .15s}
.dd.open .chev{transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:280px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:6px;z-index:30;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s,transform .12s,visibility .12s}
.dd.open .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:none;border:0;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.dd-item:hover,.dd-item:focus-visible{background:#223044;outline:none}
.dd-item.sel{background:var(--pink-soft);color:var(--pink)}
.dd-item .ii{width:28px;height:28px;border-radius:8px;background:#2b3a4f;display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.dd-item.sel .ii{background:rgba(244,184,206,.2);color:var(--pink)}
.dd-item .ii svg{width:15px;height:15px}
.dd-item .tx{flex:1}.dd-item .tx small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.dd-item .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dd-item .ck{width:16px;display:grid;place-items:center;color:var(--pink)}.dd-item .ck svg{width:15px;height:15px}
.dd-sep{height:1px;background:var(--border);margin:6px 4px}
.dd-cap{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:6px 10px 4px}

/* ---------- dashboard ---------- */
.dash-top{grid-template-columns:1.35fr 1fr 1fr}
.dash-bottom{grid-template-columns:2fr 1fr}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:0 -4px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:10px 8px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--pink);border-color:var(--pink)}
.tabs .cnt{font-size:11px;background:#2b3a4f;color:var(--muted);border-radius:10px;padding:1px 6px}
.tabs button.on .cnt{background:var(--pink-soft);color:var(--pink)}
.scroll{max-height:268px;overflow:auto;margin-right:-8px;padding-right:8px}
.rem{display:flex;flex-direction:column}
.rem .pet{display:grid;place-items:center;margin:6px 0 2px}
.rem .pet .mascot{width:104px;height:104px}
.rem .who{font-size:11px;color:var(--pink);font-weight:600;letter-spacing:.06em;text-align:center}
.rem .msg{font-size:15px;line-height:1.45;text-align:center;margin:6px 4px 0;font-weight:500}
.rem .acts{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.kstack{display:grid;gap:16px;grid-template-rows:repeat(3,auto)}
.kpi{display:flex;flex-direction:column}
.kpi .lab{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .lab svg{width:14px;height:14px}
.kpi .big{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi .big small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .note{color:var(--muted);font-size:12px;margin-top:3px}
.kpi.hl{background:linear-gradient(135deg,rgba(244,184,206,.30),rgba(217,140,171,.10) 55%,var(--card));border-color:rgba(244,184,206,.45)}
.kpi.hl .lab{color:var(--pink2)}
.kpi.dash{border-style:dashed;background:transparent}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.chip-up{background:rgba(159,216,184,.14);color:var(--ok);font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;display:inline-flex;gap:3px;align-items:center}
.chip-up svg{width:11px;height:11px}
.segbar{display:flex;gap:5px;margin-top:10px}.segbar i{height:6px;border-radius:6px;background:var(--pink)}.segbar i.rest{background:#2f4058}
.chart-box{position:relative;height:300px;margin-top:12px}
.chart-box.sm{height:230px}
.legend{display:flex;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted);font-weight:400;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i,.lgchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.lgchip{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:3px 6px;border-radius:8px;color:var(--muted);font:inherit;font-size:12px;transition:opacity .15s,background .15s}
.lgchip:hover{background:#26354A;color:var(--text)}
.lgchip.off{opacity:.35}
.spark{display:block;flex-shrink:0}
.ring{flex-shrink:0}

/* ---------- lists ---------- */
.check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #2b3a4f;cursor:pointer}
.check:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:grid;place-items:center;flex-shrink:0;transition:all .15s}
.box svg{width:13px;height:13px;color:#2a1a22;opacity:0}
.check.done .box{background:var(--pink);border-color:var(--pink)}
.check.done .box svg{opacity:1}
.check.done .lbl b{color:var(--muted);text-decoration:line-through}
.check .lbl{flex:1;min-width:0}
.check .lbl b{font-weight:500;display:block}
.check .lbl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sec-lab{font-size:11px;color:var(--muted);letter-spacing:.06em;margin:10px 4px 2px;display:flex;align-items:center;gap:6px}
.sec-lab svg{width:13px;height:13px}
.task{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #2b3a4f}
.task .lbl{flex:1}.task .lbl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.search{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--muted);min-width:220px}
.search svg{width:15px;height:15px}
.search input{background:none;border:0;color:var(--text);font:inherit;outline:none;width:100%}

/* ---------- stats ---------- */
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}

/* ---------- calendar (progress) ---------- */
.cal-row{grid-template-columns:2fr 1fr}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cal-head .mon{display:flex;align-items:center;gap:10px}
.cal-head .mon b{font-size:17px;font-weight:600;min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px;letter-spacing:.04em}
.day{background:var(--card2);border:1px solid transparent;border-radius:12px;min-height:82px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:var(--text);transition:border-color .15s,background .15s}
.day:hover{border-color:var(--rose)}
.day.blank{background:none;cursor:default;border:0}
.day.future{opacity:.4;cursor:default}
.day.future:hover{border-color:transparent}
.day.today{border-color:var(--pink)}
.day.sel{background:rgba(244,184,206,.16);border-color:var(--pink)}
.day .n{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.day .n svg{width:12px;height:12px;color:var(--pink)}
.day .dots{display:flex;flex-wrap:wrap;gap:4px}
.day .dots i{width:9px;height:9px;border-radius:50%}
.cal-legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-legend i{width:9px;height:9px;border-radius:50%}
.drow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #2b3a4f}
.drow:last-child{border-bottom:0}
.drow .tx{flex:1;min-width:0}.drow .tx b{font-weight:500;font-size:13px}
.drow .tx .bar{height:5px;margin-top:6px}
.drow .val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.donut{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center;margin-top:14px}
.donut .cv{position:relative;height:170px}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center b{font-size:22px;font-weight:700;display:block}.center small{color:var(--muted);font-size:11px}
.lg-list>div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px solid #2b3a4f}
.lg-list>div:last-child{border-bottom:0}
.lg-list span{display:flex;align-items:center;gap:8px}
.lg-list i{width:9px;height:9px;border-radius:3px;display:inline-block}
.halves{grid-template-columns:1fr 1fr}
.perf-row{grid-template-columns:2fr 1fr}

/* ---------- habit table ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;padding:8px;text-align:center}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-top:1px solid #2b3a4f;text-align:center}
.cell{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;border:1.5px solid var(--border);cursor:pointer}
.cell.on{background:var(--pink);border-color:var(--pink);color:#2a1a22}
.cell.off{border-style:dashed;opacity:.35;cursor:default}
.cell svg{width:14px;height:14px}
.hname b{font-weight:500;display:block}.hname small{color:var(--muted);font-size:12px}
.grp-row td{background:#1d2938;padding:9px 10px;text-align:left;font-size:13px;border-top:1px solid var(--border)}
.grp-row td>span{display:inline-flex;align-items:center;gap:8px}
.grp-row svg{width:15px;height:15px;color:var(--muted)}
.grp-row .muted{font-size:12px;margin-left:4px}
tbody tr:first-child.grp-row td{border-top:0}
.cell[data-h]:hover{border-color:var(--pink)}

/* ---------- focus / skincare ---------- */
.focus-grid{grid-template-columns:1fr 1.3fr 1fr}
.skin-grid{grid-template-columns:1fr 1fr 1.1fr}
.timer{display:grid;place-items:center;padding:20px 0}
.timer svg.ringbig{width:260px;height:260px}
.timer .time{font-size:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--pink);color:var(--pink);background:var(--pink-soft)}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
.mode{border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px;display:flex;gap:12px}
.mode.on{border-color:var(--pink);background:var(--pink-soft)}
.mode svg{color:var(--pink);width:18px;height:18px;flex-shrink:0;margin-top:2px}
.mode b{font-weight:600;font-size:13px}.mode p{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.warn{display:flex;gap:10px;align-items:flex-start;background:#2a2533;border:1px solid #4a3a4a;border-radius:12px;padding:12px;font-size:12px;color:var(--pink2);line-height:1.45}
.warn svg{width:16px;height:16px;flex-shrink:0}
.site{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2b3a4f;font-size:13px}
.toggle{width:34px;height:20px;border-radius:20px;background:#3a475b;position:relative;cursor:pointer;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--pink)}.toggle.on::after{left:17px}
.companion-wrap{display:flex;align-items:flex-end;gap:6px}
.bubble{background:var(--card2);border:1px solid var(--border);border-radius:14px 14px 4px 14px;padding:12px 14px;max-width:270px;font-size:13px;line-height:1.45;align-self:flex-start}
.bubble .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bubble .who{font-size:11px;color:var(--pink);font-weight:600;margin-bottom:4px;letter-spacing:.04em}

/* ---------- mascots ---------- */
.mascot{width:92px;height:92px;flex-shrink:0}
.mascot .eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
.mascot .tail{animation:wag 1.6s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
.mascot.bounce{animation:bounce 2.8s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.reduce .mascot *,.reduce .mascot{animation:none!important}

.placeholder{display:grid;place-items:center;text-align:center;min-height:300px;color:var(--muted);gap:10px}
.placeholder svg{width:40px;height:40px;color:var(--pink)}
.preview-note{position:fixed;bottom:14px;right:16px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);z-index:5}
.preview-note b{color:var(--pink)}
.toast{position:fixed;bottom:56px;right:16px;background:var(--pink);color:#2a1a22;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:none}

@media (max-width:1250px){
  .dash-top{grid-template-columns:1fr 1fr}
  .dash-top>.tabcard{grid-column:1/-1}
}
@media (max-width:1150px){
  .dash-bottom,.cal-row,.perf-row,.halves,.focus-grid,.skin-grid{grid-template-columns:1fr}
  .kstack{grid-template-columns:repeat(3,1fr);grid-template-rows:auto}
}
@media (max-width:760px){
  .dash-top{grid-template-columns:1fr}
  .kstack{grid-template-columns:1fr}
  .sidebar{width:68px}.sidebar .label,.sidebar .logo-text{display:none}
  .nav .sub a{padding-left:10px}.nav .sub::before{display:none}
  main{padding:18px 16px 60px}
  .day{min-height:56px;padding:6px}
  .donut{grid-template-columns:1fr}
}

 const item=([c,i])=>`<button class="dd-item ${c===cur?"sel":""}" data-set="cat" data-val="${c}" role="option" aria-selected="${c===cur}"><span class="ii">${ic(i)}</span><span class="tx">${c}${c==="All Progress"?"<small>Aggregate of all categories</small>":""}</span><span class="pc">${todayPct(c)}%</span><span class="ck">${c===cur?ic("check"):""}</span></button>`;

 return header("Habit Tracker","Week of Nov 2 – 8 · dashed cells are unscheduled and never count as missed",`<div class="hdr-actions">${catDropdown()}<button class="btn">${ic("plus")}New habit</button></div>`)+`
 <div class="grid stats" style="margin-bottom:16px">
  <div class="card stat"><div class="k">${ic("percent")}Week completion</div><div class="v">${avg(series(state.cat,7))}%</div><div class="bar"><i style="width:${avg(series(state.cat,7))}%"></i></div></div>
  <div class="card stat"><div class="k">${ic("flame")}Best streak</div><div class="v">12 <small>days</small></div></div>
  <div class="card stat"><div class="k">${ic("target")}Weekly targets met</div><div class="v">5<small> / 7</small></div></div>
  <div class="card stat"><div class="k">${ic("archive")}Archived</div><div class="v">2 <small>history kept</small></div></div></div>
 <div class="card" style="overflow:auto"><table><thead><tr><th>Habit</th>${days.map((d,i)=>`<th style="${i===6?"color:var(--pink)":""}">${d}</th>`).join("")}<th>Streak</th><th>8-week trend</th></tr></thead><tbody>
 ${groups.map(g=>{const due=state.habits.filter(h=>h.c===g.c);
   return `<tr class="grp-row"><td colspan="10"><span><span class="cdot" style="background:${CAT_COLORS[g.c]}"></span>${ic(CAT_ICON[g.c])}<b>${g.c}</b><span class="muted">${g.rows.length} habit${g.rows.length>1?"s":""} · ${due.filter(h=>h.d).length}/${due.length} done today</span></span></td></tr>`
   +g.rows.map((r,ri)=>`<tr><td class="hname"><b>${r[0]}</b><small>${r[2]}</small></td>${r[3].map(x=>`<td>${cell(x,-1)}</td>`).join("")}<td>${cell(todayOf(r),state.habits.indexOf(habit(r[0])))}</td><td><span class="tag pink">${ic("flame")}${streakOf(r)}</span></td><td><div style="display:flex;justify-content:center">${svgSpark(gen(META[g.c].seed+ri*.7,8,66,18),84,26)}</div></td></tr>`).join("")}).join("")}
 </tbody></table></div>`},

todo(){
 return header("To-do List","One-time tasks, separate from your recurring habits",`<div class="hdr-actions"><div class="search">${ic("search")}<input placeholder="Search tasks…"></div><button class="btn">${ic("plus")}Add task</button></div>`)+`
 <div class="seg" style="display:inline-flex;margin-bottom:16px"><button class="on">All Tasks</button><button>Today</button><button>Upcoming</button><button>Overdue</button><button>Completed</button></div>
 <div class="card">${state.tasks.map((t,i)=>`<div class="check ${t.d?"done":""}" data-task="${i}"><div class="box">${ic("check")}</div><div class="lbl"><b>${t.n}</b><small>${t.due} · ${t.c}</small></div><span class="tag ${t.p==="High"?"high":""}">${t.p}</span></div>`).join("")}</div>`},

focus(){
 const modes=[["normal","play-circle","Normal","Pause or end anytime. Sites unblock when the session ends."],["strict","lock","Strict","No pausing. Settings lock. Emergency exit needs confirmation and is recorded."],["scheduled","calendar-clock","Scheduled","Blocks automatically on set days and times. Chrome must be open."]];
 return `<div class="reduce">`+header("Focus Mode","Companion animations pause while a session is running")+`
 <div class="grid focus-grid">
  <div class="card"><h3><span class="t">${ic("sliders-horizontal")}Session setup</span></h3><div style="margin-top:14px">
   <div class="field"><label>Category</label><select class="select"><option>MVG</option><option>Exercise</option><option>Self Care</option></select></div>
   <div class="field"><label>Related task (optional)</label><select class="select"><option>Send Christmas coloring book proofs</option><option>None</option></select></div>
   <div class="field"><label>Focus duration</label><div class="chips">${[15,25,45,60].map(m=>`<button class="chip ${state.focusMin===m?"on":""}" data-fm="${m}">${m}m</button>`).join("")}<button class="chip">Custom</button></div></div>
   <div class="field"><label>Break</label><div class="chips">${[5,10,15].map(m=>`<button class="chip ${state.breakMin===m?"on":""}" data-bm="${m}">${m}m</button>`).join("")}<button class="chip">Custom</button></div></div>
   <div class="field"><label>Profile</label><div class="chips"><button class="chip on">Deep Work</button><button class="chip">Creative</button><button class="chip">Learning</button><button class="chip">+ Custom</button></div></div></div></div>
  <div class="card"><div class="timer"><div style="position:relative;display:grid;place-items:center">
    <svg class="ringbig" viewBox="0 0 260 260"><circle cx="130" cy="130" r="116" fill="none" stroke="#2b3a4f" stroke-width="10"/><circle cx="130" cy="130" r="116" fill="none" stroke="var(--pink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="729" stroke-dashoffset="0" transform="rotate(-90 130 130)"/></svg>
    <div style="position:absolute;text-align:center"><div class="time">${String(state.focusMin).padStart(2,"0")}:00</div><div class="muted" style="margin-top:4px">Deep Work · ${state.mode[0].toUpperCase()+state.mode.slice(1)}</div></div></div>
    <div style="display:flex;gap:10px;margin-top:20px"><button class="btn" id="startFocus">${ic("play")}Start focus</button><button class="btn ghost">${ic("coffee")}Break ${state.breakMin}m</button></div></div>
   <div style="margin-top:8px">${modes.map(([k,i,t,d])=>`<div class="mode ${state.mode===k?"on":""}" data-mode="${k}">${ic(i)}<div><b>${t}</b><p>${d}</p></div></div>`).join("")}</div>
   ${state.mode==="strict"?`<div class="warn">${ic("shield-alert")}<span>Strict Mode isn't tamper-proof: disabling or uninstalling the Chrome extension removes the blocking.</span></div>`:""}</div>
  <div class="card"><h3><span class="t">${ic("shield-ban")}Blocked sites</span><span class="tag">Deep Work</span></h3>
   <div class="warn" style="margin:14px 0;background:#232b38;border-color:var(--border);color:var(--muted)">${ic("plug-zap")}<span>Blocking: <b style="color:var(--text)">Not active</b>. Install and connect the DAYFLOW Chrome extension so it can confirm blocking.</span></div>
   ${["facebook.com","instagram.com","tiktok.com","youtube.com","reddit.com","x.com"].map((s,i)=>`<div class="site"><span>${s} <span class="muted" style="font-size:11px">+ subdomains</span></span><span class="toggle ${i!==3?"on":""}"></span></div>`).join("")}
   <div style="display:flex;gap:8px;margin-top:14px"><input class="select" placeholder="Add a domain…"><button class="btn sm">${ic("plus")}</button></div>
   <div class="muted" style="font-size:12px;margin-top:14px">Allowed exception: <span style="color:var(--pink)">youtube.com/@maevgraphics</span></div></div>
 </div></div>`},

skincare(){
 const list=a=>a.map(([n,s,d])=>`<div class="check ${d?"done":""}"><div class="box">${ic("check")}</div><div class="lbl"><b>${n}</b></div><span class="tag">${s}</span></div>`).join("");
 const cal=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>[d,["Tretinoin","Rest","Glycolic","Tretinoin","Rest","Glycolic","Rest"][i]]);
 return header("Skin Care","Your routine, your schedule. Skipping a night is not a failure.",`<button class="btn">${ic("plus")}Add product</button>`)+`
 <div class="grid skin-grid">
  <div class="card"><h3><span class="t">${ic("sun")}Morning</span><span class="muted" style="font-size:12px;font-weight:400">2/3</span></h3><div style="margin-top:6px">${list([["Toner","Daily",true],["Lotion","Daily",true],["Myra E","Daily",false]])}</div></div>
  <div class="card"><h3><span class="t">${ic("moon")}Evening · Sunday</span><span class="muted" style="font-size:12px;font-weight:400">Rest night</span></h3><div style="margin-top:6px">${list([["Toner","Daily",false],["Lotion","Daily",false]])}
   <div class="check" style="opacity:.6"><div class="box" style="border-style:dashed"></div><div class="lbl"><b>No active tonight (rest night)</b></div><span class="tag pink">Rest</span></div></div></div>
  <div class="card"><div class="companion-wrap" style="justify-content:flex-end"><div class="bubble"><div class="who">TOBI · PERSIAN</div>Your evening routine is waiting! Tonight's a rest night, so just toner and lotion.<div class="acts"><button class="btn sm" data-r="done">${ic("check")}Done</button><button class="btn ghost sm" data-r="later">Later</button><button class="btn ghost sm" data-r="dismiss">Dismiss</button></div></div>${CAT}</div></div>
 </div>
 <div class="card" style="margin-top:16px"><h3><span class="t">${ic("calendar-range")}Active schedule</span><span class="muted" style="font-size:12px;font-weight:400">Glycolic Acid and Tretinoin are never on the same night</span></h3>
  <div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px">${cal.map(([d,a],i)=>`<div style="background:${a==="Rest"?"#26354A":"var(--pink-soft)"};border:1px solid ${i===6?"var(--pink)":"var(--border)"};border-radius:12px;padding:12px 4px;text-align:center"><div class="muted" style="font-size:12px">${d}</div><div style="margin-top:6px;font-weight:600;font-size:13px;color:${a==="Rest"?"var(--muted)":"var(--pink)"}">${a}</div></div>`).join("")}</div>
  <p class="muted" style="font-size:12px;margin-top:14px">DAYFLOW doesn't prescribe a schedule. Set these to match your dermatologist's guidance.</p></div>`},
};
function placeholder(id){const n=NAV_FLAT.find(x=>x.id===id);return header(n.l,"Not mocked in this preview")+`<div class="card placeholder"><div>${ic(n.i)}</div><div style="max-width:420px">This screen will follow the same cards, charts and controls. Tell me if there's anything specific you want to see here before the full build.</div></div>`}

/* ================= chart mounting ================= */
const mounts={
 dashboard(){
  const cat=state.cat,wk=state.perfRange==="Week",n=wk?7:30,labels=wk?WEEK_LABELS:dayLabels(30);
  if(isAll())mk("perf",multiLineCfg(labels,CAT_NAMES.map(c=>({label:c,data:series(c,n),color:CAT_COLORS[c],hidden:state.hidden.has(c)})),wk?7:6));
  else mk("perf",lineCfg(labels,{label:cat,data:series(cat,n),color:CAT_COLORS[cat]},null,n-1,wk?7:6));
 },
 progress(){
  const n=+state.range,cat=state.cat,all=isAll(),labels=dayLabels(n);
  mk("trend",lineCfg(labels,{label:cat,data:series(cat,n),color:all?"#F4B8CE":CAT_COLORS[cat]},{label:all?"Previous period":"All Progress",data:all?gen(1.7,n,60):series("All Progress",n)},n-1,n>30?8:7));
  mk("compare",{type:"bar",data:{labels:CAT_NAMES,datasets:[{data:CAT_NAMES.map(c=>avg(series(c,n))),backgroundColor:CAT_NAMES.map(c=>inCat(c)?CAT_COLORS[c]:DIM),borderRadius:6,borderSkipped:false,barThickness:14}]},
   options:{indexAxis:"y",maintainAspectRatio:false,scales:{x:{...yPct(),grid:{color:"#2b3a4f",drawTicks:false}},y:{grid:{display:false},border:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>` ${c.parsed.x}% average`}}}}});
  mk("focusStack",{type:"bar",data:{labels:["Oct 12","Oct 19","Oct 26","Nov 2"],datasets:Object.entries(FOCUS_WEEKS).map(([c,d])=>({label:c,data:d,backgroundColor:inCat(c)?CAT_COLORS[c]:DIM,borderRadius:4,borderSkipped:false,maxBarThickness:40}))},
   options:{maintainAspectRatio:false,scales:{x:{...xPlain(),stacked:true},y:{stacked:true,ticks:{callback:v=>v+"h",padding:8},grid:{color:"#2b3a4f",drawTicks:false},border:{display:false,dash:[4,4]}}},interaction:{mode:"index",intersect:false},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y}h`}}}}});
  const comp=Math.round(n*.75),intr=Math.max(1,Math.round(n*.1));
  mk("sessions",donutCfg(["Completed","Interrupted"],[comp,intr],["#F4B8CE","#5E7391"],"76%"));
 }
};

/* ================= render & events ================= */
function navLink(n){return `<a class="${state.page===n.id?"active":""}" data-go="${n.id}" title="${n.l}">${ic(n.i)}<span class="label">${n.l}</span></a>`}
function render(){
 charts.splice(0).forEach(c=>c.destroy());
 const app=$("#app");
 if(!state.authed){app.classList.add("auth");$("#main").innerHTML=loginView();lucide.createIcons();return}
 app.classList.remove("auth");
 $("#nav").innerHTML=NAV.map(n=>n.group
  ?`<button class="grp" data-grp title="${n.group}">${ic(n.i)}<span class="label">${n.group}</span>${ic(state.catOpen?"chevron-down":"chevron-right",'class="label grp-chev"')}</button><div class="sub" ${state.catOpen?"":"hidden"}>${n.items.map(navLink).join("")}</div>`
  :navLink(n)).join("");
 $("#main").innerHTML=(pages[state.page]||(()=>placeholder(state.page)))();
 lucide.createIcons();
 (mounts[state.page]||(()=>{}))();
}
function closeDD(){document.querySelectorAll(".dd.open").forEach(d=>{d.classList.remove("open");d.querySelector("[data-dd-toggle]").setAttribute("aria-expanded","false")})}
function logIn(){state.authed=true;state.page="dashboard";render();toast("Preview login: no real account is checked yet")}

document.addEventListener("submit",e=>{if(e.target.id==="loginForm"){e.preventDefault();logIn()}});
document.addEventListener("click",e=>{
 const t=e.target;
 const tg=t.closest("[data-dd-toggle]");
 if(tg){const dd=tg.closest(".dd"),opening=!dd.classList.contains("open");closeDD();
  if(opening){dd.classList.add("open");tg.setAttribute("aria-expanded","true");const it=dd.querySelector(".dd-item.sel")||dd.querySelector(".dd-item");requestAnimationFrame(()=>it.focus({preventScroll:true}))}return}
 const st=t.closest("[data-set]");if(st){state[st.dataset.set]=st.dataset.val;render();return}
 if(!t.closest(".dd"))closeDD();
 const eye=t.closest("[data-eye]");if(eye){const pw=$("#pw");pw.type=pw.type==="password"?"text":"password";return}
 const soon=t.closest("[data-soon]");if(soon){toast(`${soon.dataset.soon} comes with the real app`);return}
 if(t.closest("#logout")){state.authed=false;render();return}
 if(t.closest("[data-grp]")){state.catOpen=!state.catOpen;render();return}
 const g=t.closest("[data-go]");if(g){state.page=g.dataset.go;render();$("#main").scrollTop=0;return}
 const ln=t.closest("[data-line]");if(ln){const c=ln.dataset.line;state.hidden.has(c)?state.hidden.delete(c):state.hidden.add(c);ln.classList.toggle("off");const ch=window.Chart&&Chart.getChart("perf");if(ch){const i=CAT_NAMES.indexOf(c);ch.setDatasetVisibility(i,!state.hidden.has(c));ch.update()}return}
 const day=t.closest("[data-day]");if(day){state.selDay=day.dataset.day;render();return}
 const cal=t.closest("[data-cal]");if(cal&&!cal.disabled){state.calOffset=Math.min(0,state.calOffset+ +cal.dataset.cal);state.selDay=null;render();return}
 const h=t.closest("[data-h]");if(h){const x=state.habits[+h.dataset.h];x.d=!x.d;render();if(x.d)toast("Nice work! Logged for today");return}
 const tk=t.closest("[data-task]");if(tk){const x=state.tasks[+tk.dataset.task];x.d=!x.d;render();if(x.d)toast("Task completed");return}
 const sc=t.closest("[data-sc]");if(sc){const x=state.selfcare[+sc.dataset.sc];x.d=!x.d;render();if(x.d)toast(`${x.n} logged. Next date updated`);return}
 const sk=t.closest("[data-skin]");if(sk){const[k,i]=sk.dataset.skin.split("-");const x=state.skin[k][+i];x.d=!x.d;
  if(k==="pm")habit("Evening skincare routine").d=state.skin.pm.every(p=>p.d);
  if(k==="am")habit("Morning skincare routine").d=state.skin.am.every(p=>p.d);render();return}
 const r=t.closest("[data-r]");if(r){const k=r.dataset.r,msg={done:"Marked done, stats updated",later:"Snoozed for 30 minutes",dismiss:"Dismissed (not marked done)"}[k];
  if(state.page==="dashboard"){const rem=currentReminder();if(rem){if(k==="done"&&rem.h){habit(rem.h).d=true;if(rem.h==="Evening skincare routine")state.skin.pm.forEach(p=>p.d=true)}state.dismissed.add(rem.t)}render()}
  else{const b=r.closest(".bubble");b.style.transition="opacity .2s";b.style.opacity="0";setTimeout(()=>b.remove(),200)}
  toast(msg);return}
 const fm=t.closest("[data-fm]");if(fm){state.focusMin=+fm.dataset.fm;render();return}
 const bm=t.closest("[data-bm]");if(bm){state.breakMin=+bm.dataset.bm;render();return}
 const md=t.closest("[data-mode]");if(md){state.mode=md.dataset.mode;render();return}
 if(t.closest(".toggle")){t.closest(".toggle").classList.toggle("on");return}
 if(t.closest("#startFocus")){toast("Preview only: the timer runs in the real app");return}
 if(t.closest("#collapse")){$("#sidebar").classList.toggle("collapsed");setTimeout(()=>charts.forEach(c=>c.resize()),220);return}
});
document.addEventListener("keydown",e=>{
 const dd=document.querySelector(".dd.open");
 if(!dd){if(e.key==="ArrowDown"&&document.activeElement?.matches("[data-dd-toggle]")){e.preventDefault();document.activeElement.click()}return}
 if(e.key==="Escape"){closeDD();dd.querySelector("[data-dd-toggle]").focus();return}
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const items=[...dd.querySelectorAll(".dd-item")];let i=items.indexOf(document.activeElement);
  i=e.key==="ArrowDown"?Math.min(items.length-1,i+1):Math.max(0,i-1);items[i].focus()}
});
render();
</script>
</body>
</html>
